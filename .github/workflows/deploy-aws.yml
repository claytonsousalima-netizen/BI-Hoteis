# ============================================================
# GitHub Actions — Deploy Workflow
#
# Trigger: PR or push to main-aws branch
# Purpose: Canary deploy to AWS EC2 via Docker Swarm
# - PR: smoke build only (validates Dockerfile)
# - Push: full build, push, and deploy with health checks
# ============================================================

name: deploy-aws

on:
  pull_request:
    branches:
      - main-aws
  push:
    branches:
      - main-aws

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bi-hoteis
  AWS_REGION: us-east-1

jobs:
  smoke-build:
    name: Smoke Build (Validate Dockerfile)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest
    needs: smoke-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find EC2 instance
        id: find-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=estancorp-rouparia-prod-app" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "ERROR: Could not find running EC2 instance with tag Name=estancorp-rouparia-prod-app"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      - name: Execute deployment on EC2 via SSM
        id: ssm-deploy
        env:
          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          REGISTRY_ORG: ${{ github.repository_owner }}
        run: |
          # Write deploy script to file
          cat > /tmp/deploy.sh << 'DEPLOYEOF'
          #!/bin/bash
          set -euo pipefail

          echo "=== Canary Deploy: bi-hoteis ==="

          export IMAGE_TAG="IMG_TAG_PLACEHOLDER"
          export REGISTRY_ORG="REGISTRY_ORG_PLACEHOLDER"
          export STACK_NAME="bi-hoteis"

          # Login to GHCR
          echo "GHCR_TOKEN_PLACEHOLDER" | docker login ghcr.io -u "GHCR_USERNAME_PLACEHOLDER" --password-stdin
          echo "[OK] GHCR authenticated"

          # Create/update .env file
          mkdir -p /opt/app-bi-hoteis
          cat > /opt/app-bi-hoteis/.env << ENVEOF
          STACK_NAME=$STACK_NAME
          IMAGE_TAG=$IMAGE_TAG
          REGISTRY_ORG=$REGISTRY_ORG
          ENVEOF

          echo "Pulling ghcr.io/$REGISTRY_ORG/bi-hoteis:$IMAGE_TAG..."
          docker pull "ghcr.io/$REGISTRY_ORG/bi-hoteis:$IMAGE_TAG"
          echo "[OK] Image pulled"

          echo "Deploying stack..."
          cd /opt/app-bi-hoteis
          docker stack deploy -c docker-compose.yml "$STACK_NAME" --with-registry-auth
          echo "[OK] Stack deployed"

          echo "Monitoring rollout..."
          for i in $(seq 1 36); do
            REPLICAS=$(docker service ls --filter name="$STACK_NAME" --format "{{.Replicas}}" 2>/dev/null | head -1 || echo "0/0")
            echo "[$i/36] Replicas: $REPLICAS"

            if [ "$REPLICAS" = "2/2" ]; then
              echo "[OK] All replicas ready!"
              break
            fi

            sleep 10
          done

          echo "Running health checks..."
          for i in $(seq 1 12); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/healthz 2>/dev/null || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "[OK] Health check passed (HTTP $HTTP)"
              echo "=== Deploy successful ==="
              exit 0
            fi
            echo "[$i/12] Health check waiting (HTTP $HTTP)..."
            sleep 5
          done

          echo "[FAIL] Health check failed after rollout"
          exit 1
          DEPLOYEOF

          # Replace placeholders with actual values
          sed -i "s/IMG_TAG_PLACEHOLDER/${IMAGE_TAG}/g" /tmp/deploy.sh
          sed -i "s/GHCR_TOKEN_PLACEHOLDER/${GHCR_TOKEN}/g" /tmp/deploy.sh
          sed -i "s/GHCR_USERNAME_PLACEHOLDER/${GHCR_USERNAME}/g" /tmp/deploy.sh
          sed -i "s/REGISTRY_ORG_PLACEHOLDER/${REGISTRY_ORG}/g" /tmp/deploy.sh

          # JSON-encode and send via SSM
          jq -n --rawfile cmd /tmp/deploy.sh '{"commands":[$cmd]}' > /tmp/params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/params.json \
            --output-s3-bucket-name "estancorp-ssm-logs" \
            --output-s3-key-prefix "bi-hoteis-deployments" \
            --region ${{ env.AWS_REGION }} \
            --comment "Canary deploy bi-hoteis ${IMAGE_TAG}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Monitor SSM command execution
        run: |
          COMMAND_ID=${{ steps.ssm-deploy.outputs.command_id }}
          INSTANCE_ID=${{ steps.find-instance.outputs.instance_id }}

          # Poll command status (60 attempts × 10s = 10 minutes max)
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Unknown")

            echo "[$i/60] Command status: $STATUS"

            if [ "$STATUS" == "Success" ]; then
              echo "✓ Deployment successful!"
              exit 0
            elif [ "$STATUS" == "Failed" ]; then
              echo "✗ Deployment failed!"
              # Fetch command output
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }}
              exit 1
            fi

            sleep 10
          done

          echo "✗ Command timed out after 10 minutes"
          exit 1

      - name: Deployment complete
        if: success()
        run: |
          echo "✓ Deployment completed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Instance: ${{ steps.find-instance.outputs.instance_id }}"
