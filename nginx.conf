# ============================================================
# Nginx Configuration — BI Hotéis
#
# - Fallback to index.html (redirect chain: index -> loader -> report)
# - Gzip compression
# - Security headers
# - Asset caching (7 days for versioned files)
# - Healthcheck endpoint
# ============================================================

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # ===== GZIP COMPRESSION =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # ===== SECURITY HEADERS =====
    # X-Frame-Options SAMEORIGIN: se este deploy AWS for embutido via iframe
    # no SharePoint (como o GitHub Pages atual), remova esta linha.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== ROUTING =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== ASSET CACHING =====
    # Cache static assets for 7 days
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ===== HEALTHCHECK ENDPOINT =====
    # Used by Docker healthcheck and AWS ALB
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type "text/plain";
    }

    # ===== LOGGING =====
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
